# CI — typecheck, couverture des chemins API vs snapshot Laravel, tests Jest
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npm run typecheck

      - name: API routes vs services
        run: npm run check:api

      - name: Unit tests
        run: npm run test:ci
